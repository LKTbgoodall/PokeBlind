<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeBlind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Poppins:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  </head>
  <body>
    <div id="screen-home" class="screen active">
      <div class="bg-animated"></div>
      <div class="home-container">
        <header class="home-header">
          <div class="pokeball-logo">
            <div class="pokeball-logo-inner"></div>
          </div>
          <h1 class="logo-title">POKEBLIND</h1>
        </header>

        <div class="glass-panel">
          <div class="setting-group">
            <input
              type="text"
              id="player-name"
              class="glass-input"
              placeholder="Saisis ton pseudo"
              autocomplete="off"
            />
          </div>

          <div id="step-1-gens">
            <div class="setting-group" id="host-settings-panel">
              <h3 class="setting-label">GÉNÉRATIONS</h3>
              <div class="gen-grid" id="gen-grid"></div>
              <button class="btn-outline" id="btn-all-gens">
                Toutes les Générations
              </button>
            </div>

            <div class="action-row mt-3">
              <button class="btn-primary w-100" id="btn-next-step">
                SUIVANT ➔
              </button>
            </div>

            <div class="action-row mt-2">
              <input
                type="text"
                id="join-code"
                class="glass-input code-input"
                placeholder="CODE"
                autocomplete="off"
                maxlength="4"
              />
              <button class="btn-secondary" id="btn-join">REJOINDRE</button>
            </div>
          </div>

          <div id="step-2-specs" style="display: none">
            <div class="setting-group">
              <h3 class="setting-label">MODE DE JEU</h3>
              <div class="rounds-grid" id="mode-grid">
                <button class="glass-btn active" data-value="name">
                  Deviner le Nom
                </button>
                <button class="glass-btn" data-value="type">
                  Deviner le Type
                </button>
              </div>

              <h3 class="setting-label mt-3">MANCHES</h3>
              <input
                type="number"
                id="rounds-input"
                class="glass-input"
                value="10"
                min="1"
                max="1000"
              />

              <h3 class="setting-label mt-3">TEMPS PAR MANCHE (Secondes)</h3>
              <input
                type="number"
                id="timer-input"
                class="glass-input"
                value="15"
                min="5"
                max="300"
              />
            </div>

            <div class="action-row mt-3">
              <button class="btn-secondary" id="btn-prev-step">⬅ RETOUR</button>
            </div>
            <div class="action-row mt-2">
              <button class="btn-primary" id="btn-solo">SOLO</button>
              <button class="btn-primary" id="btn-host">HÉBERGER</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="screen-lobby" class="screen">
      <div
        class="game-topbar w-100"
        style="justify-content: flex-start; padding: 1rem"
      >
        <button class="btn-icon" id="btn-quit-lobby" title="Quitter">
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
          >
            <path d="M18 6L6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div class="bg-animated"></div>
      <div class="home-container" style="padding-top: 0">
        <h2 class="logo-title subtitle">
          SALON : <span id="lobby-code-display"></span>
        </h2>
        <div class="glass-panel" style="width: 100%; max-width: 600px">
          <h3 class="setting-label">JOUEURS PRÉSENTS</h3>
          <div id="lobby-players" class="lobby-players-list"></div>

          <div
            id="lobby-settings"
            style="
              border-top: 1px solid var(--glass-border);
              padding-top: 1rem;
              margin-top: 1rem;
            "
          >
            <h3 class="setting-label">PARAMÈTRES DE LA PARTIE</h3>
            <div class="action-row mt-2">
              <select id="lobby-mode-select" class="glass-input">
                <option value="name">Deviner le Nom</option>
                <option value="type">Deviner le Type</option>
              </select>
            </div>
            <div class="action-row mt-2">
              <input
                type="number"
                id="lobby-rounds-input"
                class="glass-input"
                placeholder="Manches"
                title="Nombre de manches"
              />
              <input
                type="number"
                id="lobby-time-input"
                class="glass-input"
                placeholder="Temps (s)"
                title="Temps en secondes"
              />
            </div>
            <h3 class="setting-label mt-3">GÉNÉRATIONS</h3>
            <div class="gen-grid" id="lobby-gen-grid"></div>
            <button class="btn-outline" id="lobby-btn-all-gens">
              Toutes les Générations
            </button>
          </div>

          <button
            class="btn-primary mt-3 w-100"
            id="btn-start-multi"
            style="display: none"
          >
            LANCER LA PARTIE
          </button>
          <p
            id="waiting-msg"
            class="setting-label mt-3 text-center"
            style="display: none"
          >
            En attente de l'hôte...
          </p>
        </div>
      </div>
    </div>

    <div id="screen-game" class="screen game-bg">
      <div class="game-layout">
        <aside class="game-sidebar">
          <div id="multi-scores" class="multi-scores"></div>
          <div class="score-pill" id="solo-score-pill">
            <span class="score-label">SCORE</span>
            <span id="score-display">0</span>
          </div>
        </aside>

        <main class="game-main">
          <div class="game-topbar">
            <button class="btn-icon" id="btn-quit" title="Quitter">
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
              >
                <path d="M18 6L6 18M6 6l12 12"></path>
              </svg>
            </button>
            <div class="round-pill" id="round-display">1 / 10</div>
          </div>

          <div class="timer-wrap">
            <div class="timer-track">
              <div class="timer-bar" id="timer-bar"></div>
            </div>
            <div class="timer-number" id="timer-number">15</div>
          </div>

          <div class="pokemon-arena" id="pokemon-card">
            <div class="arena-glow" id="arena-glow"></div>
            <div class="arena-platform"></div>
            <img id="pokemon-img" class="pokemon-img" src="" alt="Pokemon" />
          </div>

          <div class="type-row" id="type-badges"></div>

          <div class="answer-zone">
            <div class="feedback" id="feedback-message"></div>

            <div class="input-group" id="name-input-group">
              <input
                type="text"
                id="answer-input"
                class="answer-input"
                placeholder="Nom du Pokémon..."
                autocomplete="off"
                spellcheck="false"
              />
              <button class="btn-pass" id="btn-pass">
                <svg
                  viewBox="0 0 24 24"
                  width="24"
                  height="24"
                  stroke="currentColor"
                  stroke-width="2"
                  fill="none"
                >
                  <path d="M5 12h14M12 5l7 7-7 7"></path>
                </svg>
              </button>
            </div>

            <div
              class="type-input-group"
              id="type-input-group"
              style="display: none"
            >
              <div id="type-selector" class="type-selector-grid"></div>
              <div class="action-row mt-2">
                <button class="btn-primary" id="btn-submit-type">
                  VALIDER TYPE(S)
                </button>
                <button
                  class="btn-pass"
                  id="btn-pass-type"
                  style="width: auto; padding: 0 1rem"
                >
                  PASSER
                </button>
              </div>
            </div>
          </div>

          <div class="history-strip" id="live-history"></div>

          <div class="loading-overlay hidden" id="loading-overlay">
            <div class="pokeball-spin">
              <div class="pokeball-spin-inner"></div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div id="screen-results" class="screen">
      <div class="bg-animated"></div>
      <div class="results-container">
        <h2 class="logo-title subtitle">RÉSULTATS</h2>
        <div class="results-score" id="results-score"></div>
        <div class="results-list glass-panel" id="results-list"></div>
        <div class="action-row w-100 mt-3">
          <button class="btn-primary" id="btn-replay">REJOUER</button>
          <button class="btn-secondary" id="btn-home-results">ACCUEIL</button>
        </div>
      </div>
    </div>

    <canvas id="confetti-canvas"></canvas>
    <script src="script.js"></script>
  </body>
</html>
